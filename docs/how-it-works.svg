<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d">
  <title id="t">How the Claude Code notification hook works</title>
  <desc id="d">A Claude Code session finishes its turn. Claude Code runs the Stop hook and sends it JSON. The script reads the project folder and the last message, and macOS shows a notification banner. You see which session finished and what it did.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8f98"/>
    </marker>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4a6b"/>
      <stop offset="1" stop-color="#7a5a8c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h { font-size: 15px; font-weight: 600; fill: #1f2328; }
    .b { font-size: 12.5px; fill: #4b535d; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; fill: #24292f; }
    .n { font-size: 12px; fill: #6e7781; }
    .step { font-size: 12px; font-weight: 700; fill: #fff; }
  </style>

  <!-- background card, solid so it reads in light and dark GitHub themes -->
  <rect x="0" y="0" width="960" height="470" rx="18" fill="#f6f8fa"/>
  <text x="32" y="44" style="font-size:20px;font-weight:700;fill:#1f2328">From "turn finished" to a banner on your Mac</text>
  <text x="32" y="68" class="b">The whole path runs on your Mac. Nothing goes to a server.</text>

  <!-- step 1 -->
  <g transform="translate(32,96)">
    <rect width="200" height="170" rx="12" fill="#fff" stroke="#d0d7de"/>
    <circle cx="24" cy="26" r="13" fill="#d97757"/><text x="24" y="30.5" text-anchor="middle" class="step">1</text>
    <text x="46" y="31" class="h">Session finishes</text>
    <rect x="14" y="52" width="172" height="100" rx="8" fill="#0d1117"/>
    <text x="26" y="76" class="m" style="fill:#7ee787">✻ Claude Code</text>
    <text x="26" y="98" class="m" style="fill:#c9d1d9">● Tests pass.</text>
    <text x="26" y="116" class="m" style="fill:#c9d1d9">  PR #42 is open.</text>
    <text x="26" y="138" class="m" style="fill:#8b949e">&gt; _</text>
  </g>

  <line x1="238" y1="181" x2="266" y2="181" stroke="#8a8f98" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- step 2 -->
  <g transform="translate(272,96)">
    <rect width="200" height="170" rx="12" fill="#fff" stroke="#d0d7de"/>
    <circle cx="24" cy="26" r="13" fill="#d97757"/><text x="24" y="30.5" text-anchor="middle" class="step">2</text>
    <text x="46" y="31" class="h">Stop hook runs</text>
    <text x="16" y="62" class="b">Claude Code sends JSON</text>
    <text x="16" y="80" class="b">to the script on stdin:</text>
    <rect x="14" y="92" width="172" height="62" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="24" y="112" class="m">"cwd": ".../my-app",</text>
    <text x="24" y="130" class="m">"last_assistant_</text>
    <text x="24" y="146" class="m"> message": "Tests…"</text>
  </g>

  <line x1="478" y1="181" x2="506" y2="181" stroke="#8a8f98" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- step 3 -->
  <g transform="translate(512,96)">
    <rect width="200" height="170" rx="12" fill="#fff" stroke="#d0d7de"/>
    <circle cx="24" cy="26" r="13" fill="#d97757"/><text x="24" y="30.5" text-anchor="middle" class="step">3</text>
    <text x="46" y="31" class="h">notify-stop.sh</text>
    <text x="16" y="62" class="b">• folder name → subtitle</text>
    <text x="16" y="84" class="b">• first line of the last</text>
    <text x="16" y="102" class="b">   message → text</text>
    <text x="16" y="124" class="b">• markdown removed,</text>
    <text x="16" y="142" class="b">   about 12 words</text>
  </g>

  <line x1="718" y1="181" x2="746" y2="181" stroke="#8a8f98" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- step 4: macOS banner -->
  <g transform="translate(752,96)">
    <rect width="176" height="170" rx="12" fill="url(#wall)"/>
    <circle cx="24" cy="26" r="13" fill="#d97757"/><text x="24" y="30.5" text-anchor="middle" class="step">4</text>
    <text x="46" y="31" class="h" style="fill:#fff">macOS banner</text>
    <g filter="url(#shadow)">
      <rect x="10" y="54" width="156" height="92" rx="12" fill="#ffffff" fill-opacity="0.94"/>
    </g>
    <rect x="20" y="66" width="22" height="22" rx="5" fill="#d97757"/>
    <text x="31" y="81.5" text-anchor="middle" style="font-size:12px;font-weight:700;fill:#fff">✻</text>
    <text x="50" y="76" style="font-size:11px;font-weight:700;fill:#1f2328">Claude Code</text>
    <text x="50" y="90" style="font-size:10.5px;font-weight:600;fill:#1f2328">my-app</text>
    <text x="20" y="112" style="font-size:10.5px;fill:#1f2328">Tests pass. PR #42 is</text>
    <text x="20" y="127" style="font-size:10.5px;fill:#1f2328">open.</text>
    <text x="152" y="76" text-anchor="end" style="font-size:9.5px;fill:#6e7781">now</text>
  </g>

  <!-- why it helps -->
  <rect x="32" y="296" width="896" height="146" rx="12" fill="#fff" stroke="#d0d7de"/>
  <text x="56" y="328" class="h">Why it helps</text>

  <circle cx="64" cy="358" r="5" fill="#2da44e"/>
  <text x="80" y="362" class="b"><tspan font-weight="600" fill="#1f2328">No more checking the terminal.</tspan> Start a long task, do other work, and come back when the banner shows.</text>
  <circle cx="64" cy="386" r="5" fill="#2da44e"/>
  <text x="80" y="390" class="b"><tspan font-weight="600" fill="#1f2328">Many sessions, one glance.</tspan> The subtitle names the project, so you know which window needs you.</text>
  <circle cx="64" cy="414" r="5" fill="#2da44e"/>
  <text x="80" y="418" class="b"><tspan font-weight="600" fill="#1f2328">Context first.</tspan> The first words of the reply tell you if the result is done, blocked, or a question for you.</text>
</svg>
